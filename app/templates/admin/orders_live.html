{% extends "base.html" %}
{% block content %}

<div class="page-section">
  <div class="catalog-hero mb-4">
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
      <div>
        <h1 class="page-title mb-2">Живые заказы</h1>
        <p class="section-subtitle mb-0">
          Отслеживание накладных и текущих статусов в реальном времени.
        </p>
      </div>

      <div class="admin-role-badge">
        <i class="fa-solid fa-bolt me-2"></i>
        Live monitor
      </div>
    </div>
  </div>
</div>

<div class="live-orders-toolbar-card mb-4">
  <div class="live-orders-toolbar">
    <div class="live-orders-filter">
      <label class="form-label mb-0">Статус</label>

      <div class="filter-dropdown" id="statusDropdown">
        <select id="statusFilter" class="form-select live-orders-select d-none">
          <option value="all">Все</option>
          {% for st in allowed_statuses %}
            <option value="{{ st }}">{{ status_labels.get(st, st) }}</option>
          {% endfor %}
        </select>

        <button
          type="button"
          class="filter-dropdown-trigger"
          id="statusDropdownTrigger"
          aria-expanded="false"
        >
          <span id="statusDropdownText">Все</span>
          <span class="filter-dropdown-caret">▼</span>
        </button>

        <div class="filter-dropdown-menu" id="statusDropdownMenu">
          <button type="button" class="filter-dropdown-item active" data-value="all">Все</button>
          {% for st in allowed_statuses %}
            <button
              type="button"
              class="filter-dropdown-item"
              data-value="{{ st }}"
            >
              {{ status_labels.get(st, st) }}
            </button>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="live-orders-toolbar-actions">
      <button id="refreshBtn" class="btn btn-primary">
        <i class="fa-solid fa-rotate-right me-2"></i>
        Обновить
      </button>
      <span id="lastUpd" class="live-orders-updated-pill">—</span>
    </div>
  </div>
</div>

<div id="ordersContainer" class="live-orders-grid">
  <div class="live-orders-skeleton"></div>
  <div class="live-orders-skeleton"></div>
  <div class="live-orders-skeleton"></div>
</div>

<script>
const statusDropdown = document.getElementById("statusDropdown");
const statusDropdownTrigger = document.getElementById("statusDropdownTrigger");
const statusDropdownText = document.getElementById("statusDropdownText");
const statusDropdownItems = document.querySelectorAll(".filter-dropdown-item");
const statusFilterSelect = document.getElementById("statusFilter");

function syncStatusDropdown(value) {
  if (!statusFilterSelect) return;

  const option = [...statusFilterSelect.options].find(opt => opt.value === value);
  if (!option) return;

  statusFilterSelect.value = value;
  if (statusDropdownText) statusDropdownText.textContent = option.textContent;

  statusDropdownItems.forEach(item => {
    item.classList.toggle("active", item.dataset.value === value);
  });
}

if (statusDropdownTrigger && statusDropdown) {
  statusDropdownTrigger.addEventListener("click", () => {
    const isOpen = statusDropdown.classList.contains("open");
    statusDropdown.classList.toggle("open", !isOpen);
    statusDropdownTrigger.setAttribute("aria-expanded", String(!isOpen));
  });
}

statusDropdownItems.forEach(item => {
  item.addEventListener("click", async () => {
    const value = item.dataset.value;
    syncStatusDropdown(value);

    if (statusDropdown && statusDropdownTrigger) {
      statusDropdown.classList.remove("open");
      statusDropdownTrigger.setAttribute("aria-expanded", "false");
    }

    await fetchOrders();
  });
});

document.addEventListener("click", (e) => {
  if (!statusDropdown) return;
  if (!statusDropdown.contains(e.target)) {
    statusDropdown.classList.remove("open");
    if (statusDropdownTrigger) {
      statusDropdownTrigger.setAttribute("aria-expanded", "false");
    }
  }
});

const STATUS_LABELS = {
  "new": "Новый",
  "packed": "Собран",
  "paid": "Оплачен",
  "shipped": "Отправлен",
  "delivered": "Получен",
  "canceled": "Отменён"
};

function fmtAmount(val){
  const n = Number(val);
  return isNaN(n) ? val + " ₸" : n.toFixed(2) + " ₸";
}

function fmtDate(str){
  if(!str) return "—";
  const d = new Date(str);
  return isNaN(d) ? str : d.toLocaleString();
}

function el(tag, attrs = {}, html = ""){
  const d = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v != null) d.setAttribute(k, v);
  }
  if (html) d.innerHTML = html;
  return d;
}

function getStatusClass(status) {
  return ({
    "new": "live-badge new",
    "packed": "live-badge packed",
    "paid": "live-badge paid",
    "shipped": "live-badge shipped",
    "delivered": "live-badge delivered",
    "canceled": "live-badge canceled"
  })[status] || "live-badge";
}

async function fetchOrders(){
  try {
    const status = document.getElementById("statusFilter").value;
    const resp = await fetch(`/admin/orders/live-data?status=${encodeURIComponent(status)}`);
    if (!resp.ok) return;

    const data = await resp.json();
    const cont = document.getElementById("ordersContainer");
    cont.innerHTML = "";

    if (!data.length){
      cont.appendChild(
        el(
          "div",
          { class: "live-orders-empty" },
          `
            <div class="live-orders-empty-icon">📭</div>
            <div class="live-orders-empty-title">Нет заказов</div>
            <div class="live-orders-empty-text">Под выбранный фильтр пока ничего не найдено.</div>
          `
        )
      );
      document.getElementById("lastUpd").textContent =
        "Обновлено: " + new Date().toLocaleTimeString();
      return;
    }

    data.forEach(o => {
      const card = el("div", { class: "live-order-card" });

      const header = el("div", { class: "live-order-head" });
      header.appendChild(el("div", { class: "live-order-id" }, `Накладная #${o.id}`));
      header.appendChild(el("span", { class: getStatusClass(o.status) }, STATUS_LABELS[o.status] || o.status));
      card.appendChild(header);

      const grid = el("div", { class: "live-order-meta-grid" });
      grid.innerHTML = `
        <div class="live-order-meta-item">
          <div class="live-order-meta-label">Имя</div>
          <div class="live-order-meta-value">${o.customer_name || "—"}</div>
        </div>
        <div class="live-order-meta-item">
          <div class="live-order-meta-label">Телефон</div>
          <div class="live-order-meta-value">${o.phone || "—"}</div>
        </div>
      `;
      card.appendChild(grid);

      if (o.comment){
        const comment = el("div", { class: "live-order-comment" });
        comment.innerHTML = `
          <div class="live-order-meta-label">Комментарий</div>
          <div class="live-order-meta-value">${o.comment}</div>
        `;
        card.appendChild(comment);
      }

      const footer = el("div", { class: "live-order-footer" });
      footer.innerHTML = `
        <div class="live-order-time-block">
          <div class="live-order-meta-label">Создан</div>
          <div class="live-order-time">${fmtDate(o.created_at)}</div>
        </div>
        <div class="live-order-sum-block">
          <div class="live-order-meta-label">Сумма</div>
          <div class="live-order-amount">${fmtAmount(o.total_amount)}</div>
        </div>
      `;
      card.appendChild(footer);

      const actions = el("div", { class: "live-order-actions" });
      actions.appendChild(
        el(
          "a",
          { class: "btn btn-outline-primary w-100", href: `/admin/orders/${o.id}` },
          `<i class="fa-solid fa-arrow-up-right-from-square me-2"></i>Открыть`
        )
      );
      card.appendChild(actions);

      cont.appendChild(card);
    });

    document.getElementById("lastUpd").textContent =
      "Обновлено: " + new Date().toLocaleTimeString();
  } catch (e) {
    console.error("Ошибка при загрузке накладных:", e);
  }
}

document.getElementById("refreshBtn").addEventListener("click", fetchOrders);

const params = new URLSearchParams(window.location.search);
const urlStatus = params.get("status");

if (urlStatus) {
  syncStatusDropdown(urlStatus);
} else {
  syncStatusDropdown("new");
}

setInterval(fetchOrders, 5000);
fetchOrders();
</script>

{% endblock %}

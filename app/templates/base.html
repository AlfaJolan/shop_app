<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Econom Zhasa" }}</title>
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="/static/images/brand/favicon.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="/static/images/brand/favicon.png">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Кастомная тема -->
  <link rel="stylesheet" href="/static/css/theme.css"/>

   <style>
  /* Плавающие кнопки */
  .floating-buttons-messengers {
    position: fixed;
    left: 16px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1050; /* поверх контента, но под модалками */
  }
  .floating-buttons-messengers .float-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    color: #fff;
    box-shadow: 0 4px 10px rgba(77, 73, 73, 0.2);
    transition: transform 0.2s;
    text-decoration: none !important;
  }
  .floating-buttons-messengers .float-btn:hover {
    transform: scale(1.1);
  }
  .floating-buttons-messengers .float-btn.wa { background: #25d366; }
  .floating-buttons-messengers .float-btn.tg { background: #0088cc; }

  /* 🔹 Логотип по умолчанию */
  .brand-logo {
    height: 80px;   /* 🔥 ещё больше */
    max-height: 84px;
    width: auto;
  }

  /* 🔹 На маленьких экранах уменьшаем */
  @media (max-width: 576px) {
    .brand-logo {
      height: 58px;
      max-height: 60px;
    }
    .navbar-brand span {
      font-size: 1rem; /* текст компактнее */
    }
  }

  /* На очень маленьких экранах */
  @media (max-width: 480px) {
    .floating-buttons-messengers {
      right: 10px;
      bottom: 70px;
    }
    .floating-buttons-messengers .float-btn {
      width: 44px;
      height: 44px;
      font-size: 20px;
    }
  }

  /* 🔹 Футер: ссылки соцсетей */
  footer a {
    font-size: 1rem;
    padding: 6px 12px;
    border-radius: 6px;
    transition: transform 0.2s;
  }
  footer a:hover {
    transform: scale(1.05);
    text-decoration: none;
  }

  /* На мобилках ссылки становятся крупнее и растягиваются */
  @media (max-width: 576px) {
    footer a {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      padding: 10px;
      width: 100%;
    }
  }
</style>

</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/">
  <img src="/static/images/brand/EconomZhasaLogo.jpg" 
       alt="Эконом Жаса" 
       class="brand-logo me-2">
  <span class="fw-bold fs-4 text-primary">Эконом Жаса</span>
</a>


      <div class="d-flex align-items-center gap-3" id="auth-buttons">
  <!-- Здесь JS сам подставит Войти / Выйти / Админка -->
      </div>

    </div>
  </nav>
  {% if request.session.get("flash") %}
  <div class="alert alert-danger mt-2">
    {{ request.session.get("flash") }}
  </div>
  {% set _ = request.session.pop("flash") %}
{% endif %}

  <!-- Content -->
  <main class="flex-grow-1 py-4">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
  
<!-- Footer -->
<footer class="bg-light border-top mt-auto py-3">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
    <div class="text-muted">© {{ 2025 }} Эконом Жаса</div>
    
    <!-- 🔗 Соцсети -->
    <div class="d-flex gap-3">
      <a href="{{ request.app.state.contacts.instagram }}" 
         target="_blank" 
         class="d-flex align-items-center px-3 py-2 rounded bg-white shadow-sm text-dark text-decoration-none">
        <i class="fab fa-instagram me-2 fs-5 text-danger"></i> 
        <span class="fw-semibold">Instagram</span>
      </a>
    </div>
  </div>
</footer>

  <!-- Плавающие кнопки -->
  <div class="floating-buttons-messengers">
    <a href="{{ request.app.state.contacts.whatsapp }}" target="_blank" class="float-btn wa">
      <i class="fab fa-whatsapp"></i>
    </a>
    <a href="{{ request.app.state.contacts.telegram }}" target="_blank" class="float-btn tg">
      <i class="fab fa-telegram"></i>
    </a>
  </div>

  <!-- Bootstrap + FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/a2e0e6ad5f.js" crossorigin="anonymous"></script>

  <!-- 🔹 Новый JS для корзины -->
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/auth_buttons.js"></script>
  <script src="/static/js/order_status_bar.js?v={{ build_ts }}"></script>
  
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Shop" }}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Кастомная тема -->
  <link rel="stylesheet" href="/static/css/theme.css"/>

  <style>
    /* Плавающие кнопки */
    .floating-buttons-messengers {
      position: fixed;
      left: 16px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1050; /* поверх контента, но под модалками */
    }
    .floating-buttons-messengers a {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(77, 73, 73, 0.2);
      transition: transform 0.2s;
    }
    .floating-buttons-messengers a:hover {
      transform: scale(1.1);
    }

    /* На очень маленьких экранах */
    @media (max-width: 480px) {
      .floating-buttons-messengers {
        right: 10px;
        bottom: 70px;
      }
      .floating-buttons-messengers a {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold fs-4 text-primary" href="/">🛍️ Seller</a>
      <div class="d-flex align-items-center gap-3" id="auth-buttons">
  <!-- Здесь JS сам подставит Войти / Выйти / Админка -->
      </div>

    </div>
  </nav>
  {% if request.session.get("flash") %}
  <div class="alert alert-danger mt-2">
    {{ request.session.get("flash") }}
  </div>
  {% set _ = request.session.pop("flash") %}
{% endif %}

  <!-- Content -->
  <main class="flex-grow-1 py-4">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
  
  <!-- Footer -->
  <footer class="bg-light border-top mt-auto py-3">
    <div class="container small d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <div class="text-muted">© {{ 2025 }} Seller</div>
    </div>
  </footer>

  <!-- Плавающие кнопки -->
  <div class="floating-buttons-messengers">
    <a href="https://wa.me/7707XXXXXXX" target="_blank" class="btn btn-success">
      <i class="fab fa-whatsapp"></i>
    </a>
    <a href="https://t.me/your_channel" target="_blank" class="btn btn-info text-white">
      <i class="fab fa-telegram"></i>
    </a>
  </div>

  <!-- Bootstrap + FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/a2e0e6ad5f.js" crossorigin="anonymous"></script>

  <!-- 🔹 Новый JS для корзины -->
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/auth_buttons.js">
</script>

</body>
</html>

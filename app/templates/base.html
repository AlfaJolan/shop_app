<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Econom Zhasa" }}</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="/static/images/brand/favicon.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="/static/images/brand/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Central App CSS -->
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header -->
<nav class="navbar sticky-top site-header">
  <div class="container">
    <div class="site-header-inner">
      <a class="navbar-brand site-brand" href="/">
        <img
          src="/static/images/brand/EconomZhasaLogo.jpg"
          alt="Эконом Жаса"
          class="brand-logo"
        >
        <span class="site-brand-text">Эконом Жаса</span>
      </a>

      <div class="site-header-actions" id="auth-buttons">
        <!-- Здесь JS сам подставит Войти / Выйти / Админка -->
      </div>
    </div>
  </div>
</nav>

  {% if request.session.get("flash") %}
    <div class="container mt-3">
      <div class="alert alert-danger mb-0" role="alert">
        {{ request.session.get("flash") }}
      </div>
    </div>
    {% set _ = request.session.pop("flash") %}
  {% endif %}

  <!-- Content -->
  <main class="flex-grow-1 page-shell">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-3">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div class="text-muted">
          © 2025 Эконом Жаса
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2 gap-sm-3">
          <a
            href="{{ request.app.state.contacts.instagram }}"
            target="_blank"
            rel="noopener noreferrer"
            class="d-flex align-items-center px-3 py-2 rounded bg-white shadow-sm text-dark text-decoration-none"
          >
            <i class="fab fa-instagram me-2 fs-5 text-danger"></i>
            <span class="fw-semibold">Instagram</span>
          </a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Floating Buttons -->
  <div class="floating-buttons-messengers">
    <a
      href="{{ request.app.state.contacts.whatsapp }}"
      target="_blank"
      rel="noopener noreferrer"
      class="float-btn wa"
      aria-label="WhatsApp"
    >
      <i class="fab fa-whatsapp"></i>
    </a>
    <a
      href="{{ request.app.state.contacts.telegram }}"
      target="_blank"
      rel="noopener noreferrer"
      class="float-btn tg"
      aria-label="Telegram"
    >
      <i class="fab fa-telegram"></i>
    </a>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts -->
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/auth_buttons.js"></script>
  <script src="/static/js/order_status_bar.js?v={{ build_ts }}"></script>
</body>
</html>

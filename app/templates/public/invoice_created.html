{% extends "base.html" %}
{% block content %}

<div class="invoice-success-page">
  <div class="invoice-success-card">
    <div class="invoice-success-icon">✅</div>

    <h1 class="page-title mb-2">Накладная создана</h1>
    <p class="invoice-success-subtitle">
      Документ успешно сформирован и готов к открытию или выгрузке.
    </p>

    <div class="invoice-success-meta">
      <div class="invoice-success-meta-item">
        <span class="invoice-success-meta-label">Номер накладной</span>
        <span class="invoice-success-meta-value">№ {{ invoice.id }}</span>
      </div>
      <div class="invoice-success-meta-item">
        <span class="invoice-success-meta-label">Дата создания</span>
        <span class="invoice-success-meta-value">
          {{ invoice.created_at.strftime("%Y-%m-%d %H:%M") }}
        </span>
      </div>
    </div>

    <!-- Публичная ссылка -->
    <div class="invoice-success-link-block">
      <label class="form-label fw-semibold">Публичная ссылка</label>
      <div class="input-group invoice-success-link-group">
        <input
          type="text"
          class="form-control"
          value="/invoice/{{ invoice.id }}?pkey={{ invoice.pkey }}"
          readonly
        >
        <a
          href="/invoice/{{ invoice.id }}?pkey={{ invoice.pkey }}"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-outline-primary"
        >
          Открыть
        </a>
      </div>
    </div>

    <!-- Кнопки экспорта -->
    <div class="invoice-success-actions">
      <a
        href="/invoice/{{ invoice.id }}/export.pdf?pkey={{ invoice.pkey }}"
        class="btn btn-outline-danger"
      >
        <i class="fa-regular fa-file-pdf me-2"></i>
        Скачать PDF
      </a>

      <a
        href="/invoice/{{ invoice.id }}/export.xlsx?pkey={{ invoice.pkey }}"
        class="btn btn-outline-success"
      >
        <i class="fa-regular fa-file-excel me-2"></i>
        Скачать XLSX
      </a>
    </div>

    <div class="invoice-success-footer">
      <a href="/" class="btn btn-primary px-4">
        <i class="fa-solid fa-arrow-left me-2"></i>
        Вернуться в каталог
      </a>
    </div>
  </div>
</div>

{% endblock %}
